name: Psychology skill CI

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psychology-research-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer
      - run: python -m pip install pandas pyreadstat pyyaml jsonschema "pydantic<2" python-docx
      - run: python -m unittest discover -s tests -v

  generated-r-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psychology-research-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - run: python -m pip install pandas
      - run: mkdir -p "$RUNNER_TEMP/r-output"
      - run: python scripts/generate_longitudinal_analysis.py --data tests/fixtures/synthetic_panel.csv --spec tests/fixtures/synthetic_analysis_spec.json --output-dir "$RUNNER_TEMP/r-output"
      - name: Parse every generated R script
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            Rscript -e 'parse(file=commandArgs(trailingOnly=TRUE)[1])' "$file"
          done < <(find "$RUNNER_TEMP/r-output/code" -name '*.R' -print0)
